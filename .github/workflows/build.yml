name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q YtAudio.zip
      - name: Build
        run: |
          cd YtAudio
          F=app/src/main/java/com/example/ytaudio/DownloadService.kt
          cp $F /tmp/orig.kt
          VARIANTS=(
            ''
            's/UpdateChannel\.NIGHTLY/UpdateChannel._NIGHTLY/'
            's/, YoutubeDL\.UpdateChannel\.NIGHTLY//'
            's/UpdateChannel\.NIGHTLY/UpdateChannel.STABLE/'
            '/updateYoutubeDL/d'
          )
          ok=0
          for V in "${VARIANTS[@]}"; do
            echo "TRYING: [$V]"
            cp /tmp/orig.kt $F
            if [ -n "$V" ]; then sed -i "$V" $F; fi
            if gradle assembleDebug -q; then ok=1; break; fi
          done
          test $ok = 1
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: YtAudio/app/build/outputs/apk/debug/app-debug.apk
