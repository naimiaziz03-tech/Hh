name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - - run: unzip -q YtAudio.zip
      - run: |
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n" > YtAudio/gradle.properties
          sed -i 's/0\.17\.2/0.18.1/g' YtAudio/app/build.gradle.kts
        with:
          tag_name: latest
          files: YtAudio/app/build/outputs/apk/debug/app-debug.apk
